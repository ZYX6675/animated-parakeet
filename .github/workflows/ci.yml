name: Hybrid OS CI

on: 
  - push
  - pull_request
  - workflow_dispatch # smth imp

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Run Unit Tests
      run: |
        python3 -m unittest discover -s tests -t . -v

    - name: Run Launcher Dry Run
      run: |
        echo "test content" > dummy_test_file
        python3 -m osl.cli dummy_test_file

    - name: Build ISO Image
      run: |
        sudo touch /.dockerenv
        chmod +x iso/build.sh
        sudo ./iso/build.sh
