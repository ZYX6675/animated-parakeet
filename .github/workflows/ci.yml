#!/usr/bin/env bash
set -euo pipefail

ISO_PATH="$1"
SERIAL_LOG="qemu-serial.log"

echo "=================================================="
echo "Starting Headless Boot Verification Pipeline"
echo "Target Image: ${ISO_PATH}"
echo "=================================================="

# 1. Determine if KVM acceleration is available on this runner host
QEMU_FLAGS="-m 1024 -display none -no-reboot -cdrom ${ISO_PATH} -boot d -serial file:${SERIAL_LOG}"
if [ -w /dev/kvm ]; then
    echo "Hardware acceleration (/dev/kvm) detected. Enabling KVM mode."
    QEMU_FLAGS="${QEMU_FLAGS} -enable-kvm"
else
    echo "Hardware acceleration unavailable. Falling back to software emulation (TCG)."
fi

# 2. Launch QEMU in background, mapping its screen output straight to our workspace file
qemu-system-x86_64 ${QEMU_FLAGS} &
QEMU_PID=$!

# 3. Monitor the boot sequence log file for strings proving the system successfully came alive
TIMEOUT=120
SECS=0
INTERVAL=2
BOOT_INDICATORS=("Welcome to Arch Linux" "archiso" "login:" "root@")

echo "Waiting for kernel initialization and boot signs..."

while [ ${SECS} -lt ${TIMEOUT} ]; do
    if [ -f "${SERIAL_LOG}" ]; then
        for indicator in "${BOOT_INDICATORS[@]}"; do
            if grep -qi "${indicator}" "${SERIAL_LOG}" 2>/dev/null; then
                echo ""
                echo "=================================================="
                echo "SUCCESS: Valid boot indicator detected! [${indicator}]"
                echo "=================================================="
                echo "--- Core Boot Console Log Output ---"
                cat "${SERIAL_LOG}"
                
                # Safely terminate the emulator process
                kill "${QEMU_PID}" 2>/dev/null || true
                exit 0
            fi
        done
    fi
    sleep ${INTERVAL}
    SECS=$((SECS + INTERVAL))
    printf "."
done

# 4. Timeout error handling: if no text prints, dump whatever logs we collected and crash the run
echo ""
echo "=================================================="
echo "ERROR: Timeout reached waiting for system boot indicators."
echo "=================================================="
if ps -p "${QEMU_PID}" >/dev/null 2>&1; then
    kill "${QEMU_PID}" 2>/dev/null || true
fi

if [ -f "${SERIAL_LOG}" ]; then
    echo "--- Dump of raw serial data captured before timeout ---"
    cat "${SERIAL_LOG}"
else
    echo "Critical Error: No serial log file was generated by QEMU."
fi

exit 1
