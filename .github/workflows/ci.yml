name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    # We switch from the unstable 'ubuntu-latest' to 'ubuntu-24.04' to bypass the live migration bugs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Unit Tests
        run: python -m unittest discover -s tests -t . -v
      - name: Process Recipes Safely
        run: |
          # Robust loop that guarantees zero syntax crashes across modern shells
          for f in recipes/*.json; do
            if [ -f "$f" ]; then
              python -m osl.recipes "$f"
            fi
          done

  iso:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Install System Dependencies
        run: |
          pacman -Syu --noconfirm --needed git grub efibootmgr mtools dosfstools syslinux squashfs-tools arch-install-scripts libisoburn
      - uses: actions/checkout@v4
      - name: Run ISO Build Script
        run: |
          chmod +x iso/build.sh
          iso/build.sh
      - name: Validate Output Size
        run: |
          chmod +x scripts/size-check.sh
          if compgen -G "out/*.iso" > /dev/null; then
            scripts/size-check.sh out/*.iso
          else
            echo "Error: No ISO files found in the output directory!"
            exit 1
          fi
      - name: Upload Finished ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iso-image
          path: |
            out/*.iso
          if-no-files-found: error

   boot-test:
    needs: iso
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download Built ISO Artifact
        uses: actions/download-artifact@v4
        with:
          name: iso-image
          path: out
      - name: Install virtualization tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 libarchive-tools
      - name: Enable KVM when available
        run: |
          if [ -e /dev/kvm ]; then
            echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
            sudo udevadm control --reload-rules
            sudo udevadm trigger --name-match=kvm
          else
            echo "no /dev/kvm on this runner: boot will use slow software emulation"
          fi
      - name: Boot the ISO in QEMU and wait for a login prompt
        env:
          SERIAL_LOG: ${{ github.workspace }}/qemu-serial.log
          TIMEOUT: "600"
        run: |
          chmod +x scripts/qemu-boot-test.sh
          scripts/qemu-boot-test.sh out/*.iso
      - name: Upload console log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-serial-log
          path: qemu-serial.log
          if-no-files-found: ignore
