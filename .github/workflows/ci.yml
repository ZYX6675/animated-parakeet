name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python:
    # We switch from the unstable 'ubuntu-latest' to 'ubuntu-24.04' to bypass the live migration bugs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Unit Tests
        run: python -m unittest discover -s tests -t . -v
      - name: Process Recipes Safely
        run: |
          # Robust loop that guarantees zero syntax crashes across modern shells
          for f in recipes/*.json; do
            if [ -f "$f" ]; then
              python -m osl.recipes "$f"
            fi
          done

  iso:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Install System Dependencies
        run: |
          pacman -Syu --noconfirm --needed git grub efibootmgr mtools dosfstools syslinux squashfs-tools arch-install-scripts libisoburn
      - uses: actions/checkout@v4
      - name: Run ISO Build Script
        run: |
          chmod +x iso/build.sh
          iso/build.sh
      - name: Validate Output Size
        run: |
          chmod +x scripts/size-check.sh
          if compgen -G "out/*.iso" > /dev/null; then
            scripts/size-check.sh out/*.iso
          else
            echo "Error: No ISO files found in the output directory!"
            exit 1
          fi
      - name: Upload Finished ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iso-image
          path: |
            out/*.iso
          if-no-files-found: error

  boot-test:
    needs: iso
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Download Built ISO Artifact
        uses: actions/download-artifact@v4
        with:
          name: iso-image
          path: out
      - name: Install Virtualization Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86
      - name: Execute Headless QEMU Boot Verification
        run: |
          ISO_PATH=$(ls out/*.iso | head -n 1)
          SERIAL_LOG="qemu-serial.log"
          
          echo "Target Image: ${ISO_PATH}"
          
          QEMU_FLAGS="-m 1024 -display none -no-reboot -cdrom ${ISO_PATH} -boot d -serial file:${SERIAL_LOG}"
          
          if [ -w /dev/kvm ]; then
              echo "Hardware acceleration detected. Enabling KVM mode."
              QEMU_FLAGS="${QEMU_FLAGS} -enable-kvm"
          else
              echo "Hardware acceleration unavailable. Running software emulation."
          fi
          
          qemu-system-x86_64 ${QEMU_FLAGS} &
          QEMU_PID=$!
          
          TIMEOUT=120
          SECS=0
          INTERVAL=2
          BOOT_INDICATORS=("Welcome to Arch Linux" "archiso" "login:" "root@")
          
          echo "Waiting for live environment boot signatures..."
          while [ ${SECS} -lt ${TIMEOUT} ]; do
              if [ -f "${SERIAL_LOG}" ]; then
                  for indicator in "${BOOT_INDICATORS[@]}"; do
                      if grep -qi "${indicator}" "${SERIAL_LOG}" 2>/dev/null; then
                          echo ""
                          echo "=================================================="
                          echo "SUCCESS: Valid boot indicator detected! [${indicator}]"
                          echo "=================================================="
                          cat "${SERIAL_LOG}"
                          kill "${QEMU_PID}" 2>/dev/null || true
                          exit 0
                      fi
                  done
              fi
              sleep ${INTERVAL}
              SECS=$((SECS + INTERVAL))
              printf "."
          done
          
          echo ""
          echo "=================================================="
          echo "ERROR: Timeout reached without boot signs."
          echo "=================================================="
          kill "${QEMU_PID}" 2>/dev/null || true
          [ -f "${SERIAL_LOG}" ] && cat "${SERIAL_LOG}"
          exit 1
