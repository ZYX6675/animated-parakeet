name: ci
on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -t . -v
      - run: python -m osl.recipes recipes/*.json

  iso:
    # UNVERIFIED: written without access to Arch or archiso.
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - run: pacman -Syu --noconfirm git
      - uses: actions/checkout@v4
      - run: iso/build.sh
      - run: scripts/size-check.sh out/*.iso
      - uses: actions/upload-artifact@v4
        with:
          name: iso
          path: out/*.iso

  boot-test:
    needs: iso
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: iso
          path: out
      - run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 libarchive-tools
      - run: sudo chmod 666 /dev/kvm || true
      - run: scripts/qemu-boot-test.sh out/*.iso
